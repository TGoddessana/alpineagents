[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpineagents"
version = "0.1.0"
readme = "README.md"
description = "An agent framework that keeps configuration (Agent) and history (State) apart, with a plain Python function as the loop"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JAEGYUN JUNG" }]
keywords = ["agents", "ai-agents", "llm", "agent-framework", "anthropic", "claude", "openai", "mcp", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2",
    "typing_extensions>=4.6",
    "anthropic",
    "openai",
]

[project.urls]
Homepage = "https://github.com/TGoddessana/alpineagents"
Source = "https://github.com/TGoddessana/alpineagents"
Issues = "https://github.com/TGoddessana/alpineagents/issues"

[project.optional-dependencies]
dev = [
    "mcp>=2.2",
    "pytest",
    "pytest-asyncio",
]
mcp = [
    "mcp>=2.2",
]
docs = [
    "mkdocs<2",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alpineagents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
