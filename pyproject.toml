[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alpineagents"
version = "0.1.0"
readme = "README.md"
description = "An agent framework that keeps configuration (Agent) and history (State) apart, with a plain Python function as the loop"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "JAEGYUN JUNG" }]
dependencies = [
    "pydantic>=2",
    "typing_extensions>=4.6",
    "anthropic",
    "openai",
]

[project.optional-dependencies]
dev = [
    "mcp>=2.2",
    "pytest",
    "pytest-asyncio",
]
mcp = [
    "mcp>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alpineagents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
