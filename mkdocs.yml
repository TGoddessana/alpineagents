site_name: alpineagents
site_description: Python agent framework where the agent loop is a function you write
site_url: https://tgoddessana.github.io/alpineagents/
repo_url: https://github.com/TGoddessana/alpineagents
repo_name: TGoddessana/alpineagents
edit_uri: ""

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.footer
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            filters: ["!^_"]
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

nav:
  - Home: index.md
  - Concepts:
      - How a run works: concepts/overview.md
      - Agent: concepts/agent.md
      - State: concepts/state.md
      - Loops: concepts/loops.md
      - Tools: concepts/tools.md
      - Errors and interruptions: concepts/errors.md
      - Glossary: concepts/glossary.md
  - Guides:
      - Stop conditions: guides/stop-conditions.md
      - Ask before a tool runs: guides/approval.md
      - Check the work before finishing: guides/verify.md
      - Plan before acting: guides/plan-first.md
      - Chat: guides/chat.md
      - Structured output: guides/structured-output.md
      - Tools that use the State: guides/tool-state.md
      - Context size: guides/context-size.md
      - Models: guides/models.md
      - Progress and questions: guides/progress.md
      - Async: guides/async.md
      - MCP servers: guides/mcp.md
      - Testing: guides/testing.md
  - API reference:
      - Agent: api/agent.md
      - State: api/state.md
      - Loops and blocks: api/loops.md
      - Tools and MCP: api/tools.md
      - Models: api/models.md
      - Reporter, Human, Terminal: api/io.md
      - Data types: api/types.md
      - Errors: api/errors.md
      - Testing: api/testing.md

validation:
  links:
    anchors: warn
