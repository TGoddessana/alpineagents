      - Save and resume: learn/save-resume.md
      - Test your agent: learn/testing.md
  - Guides:
      - Stop a run: guides/stop-conditions.md
      - Check the work before finishing: guides/verify.md
      - Plan before acting: guides/plan-first.md
      - Get structured output: guides/structured-output.md
      - Let tools use the State: guides/tool-state.md
      - Let the model handle tool failures: guides/tool-failures.md
      - Tools on objects and from data: guides/more-tools.md
      - Write permission rules: guides/permissions.md
      - Keep the context small: guides/context-size.md
      - Use other models: guides/models.md
      - Handle unreliable models: guides/unreliable-models.md
      - Show progress and ask the person: guides/progress.md
      - Use async: guides/async.md
      - Use MCP servers: guides/mcp.md
      - Go back or try another path: guides/undo-and-fork.md
