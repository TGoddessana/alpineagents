site_name: alpineagents
site_description: Python agent framework where the agent loop is a function you write
site_url: https://tgoddessana.github.io/alpineagents/
repo_url: https://github.com/TGoddessana/alpineagents
repo_name: TGoddessana/alpineagents
edit_uri: ""

theme:
  name: material
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.footer
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            filters: ["!^_"]
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
  - llmstxt:
      markdown_description: alpineagents is a Python agent framework where the agent loop is a function you write. These pages teach it, then explain how it works, then list the API.
      full_output: llms-full.txt
      sections:
        Learn:
          - learn/first-agent.md: Your first agent
          - learn/tools.md: Give the agent tools
          - learn/loop.md: Write your own loop
          - learn/conversation.md: Keep the conversation
          - learn/approval.md: Ask before a tool runs
          - learn/save-resume.md: Save and resume
          - learn/testing.md: Test your agent
        Guides:
          - guides/stop-conditions.md: Stop a run
          - guides/verify.md: Check the work before finishing
          - guides/plan-first.md: Plan before acting
          - guides/structured-output.md: Get structured output
          - guides/tool-state.md: Let tools use the State
          - guides/tool-failures.md: Let the model handle tool failures
          - guides/more-tools.md: Tools on objects and from data
          - guides/permissions.md: Write permission rules
          - guides/context-size.md: Keep the context small
          - guides/models.md: Use other models
          - guides/unreliable-models.md: Handle unreliable models
          - guides/progress.md: Show progress and ask the person
          - guides/async.md: Use async
          - guides/mcp.md: Use MCP servers
          - guides/undo-and-fork.md: Go back or try another path
          - guides/production.md: Survive crashes and restarts
        Concepts:
          - concepts/overview.md: How a run works
          - concepts/agent.md: Agent
          - concepts/state.md: State and history
          - concepts/loops.md: Loops and stop rules
          - concepts/tools.md: Tool calls
          - concepts/errors.md: Errors and interruptions
          - concepts/glossary.md: Glossary
        API reference:
          - api/agent.md: Agent
          - api/state.md: State
          - api/loops.md: Loops and blocks
          - api/tools.md: Tools and MCP
          - api/permissions.md: Permissions
          - api/models.md: Models
          - api/io.md: Reporter, Human, Terminal
          - api/store.md: Store
          - api/types.md: Data types
          - api/errors.md: Errors
          - api/testing.md: Testing

